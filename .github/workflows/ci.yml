name: CI

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gateway test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run gateway tests
        run: python -m pytest tests -q

  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          if printf '%s\n' "$tracked" | grep -Eiq '(^|/)(\.env|.*\.(db|sqlite|sqlite3|apk|aab))$|(^|/).*(token|secret|credential).*'; then
            echo "Potential private artifact tracked"
            printf '%s\n' "$tracked" | grep -Ei '(^|/)(\.env|.*\.(db|sqlite|sqlite3|apk|aab))$|(^|/).*(token|secret|credential).*' || true
            exit 1
          fi
          test -f docs/api-contract.md
          test -f gateway/.env.example
